name: Bug report
description: Report incorrect visualization, transport, or server behavior
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For operator coverage in `convertPlanToExcalidraw`, open an issue on [plan-viz](https://github.com/NGA-TRAN/plan_viz) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you observed, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, MCP host configuration, and a minimal plan if you can share one.
      render: text
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Output format
      options:
        - '.excalidraw'
        - '.png'
        - Both
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - HTTP
        - Cursor /visualize command
        - Not sure
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: '24.21.0'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant stderr or host error text. Do not paste secrets.
      render: text
